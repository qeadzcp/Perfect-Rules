; ================================================================
; Perfect-Rules for Quantumult X (圈X) v1.2
; 仓库: qeadzcp/Perfect-Rules —— 与 FlClash 版 v2.x 同一套分流逻辑的圈X移植版
; 说明:
;  1) 先在圈X「设置 - 引用资源 - 节点」里添加你的机场订阅 (或在本文件
;     [server_remote] 段填入订阅地址), 地区组会按节点名自动匹配, 无需手动整理。
;  2) 圈X 不支持 hysteria2 协议, 机场的 hy2 节点在圈X里用不了, 属协议限制。
;  3) 大规则集 (广告/YouTube/Netflix/国内等) 引用 blackmatrix7 的圈X格式
;     规则库自动更新; Muse 规则在本仓库 QuantumultX/rules/muse.list。
; ================================================================

[general]
resource_parser_url=https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
server_check_url=http://www.gstatic.com/generate_204
network_check_url=http://www.baidu.com

[dns]
no-ipv6
server=223.5.5.5
server=119.29.29.29
doh-server=https://dns.alidns.com/dns-query

